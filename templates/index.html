<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ObjectOracle MVP</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 1rem;
      line-height: 1.5;
      background: #f8f8f8;
      color: #111;
    }

    h1 {
      margin-top: 0.5rem;
      font-size: clamp(1.35rem, 5vw, 2rem);
    }

    p {
      margin: 0.5rem 0 1rem;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 1rem;
      background: #fff;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.04);
    }

    form {
      display: grid;
      gap: 0.75rem;
    }

    .hint {
      margin: 0;
      color: #666;
      font-size: 0.92rem;
    }

    input[type="file"] {
      width: 100%;
      font-size: 1rem;
      padding: 0.65rem;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
    }

    button {
      width: 100%;
      min-height: 48px;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid #111;
      background: #111;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      touch-action: manipulation;
    }

    .poem {
      white-space: pre-wrap;
      line-height: 1.8;
      background: #fff;
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid #e4e4e4;
    }

    .error {
      color: #b00020;
      font-weight: 600;
    }

    @media (min-width: 768px) {
      body {
        padding: 2rem 1rem;
      }

      button {
        width: auto;
        min-width: 220px;
      }
    }
  </style>
</head>
<body>
  <h1>ObjectOracle（MVP）</h1>
  <p>画像をアップロードすると、AIが哲学的な詩に変換します。</p>

  <div class="card">
    <form method="post" enctype="multipart/form-data">
      <input type="file" name="image" accept="image/*" capture="environment" required />
      <p class="hint">スマホでは「写真を撮る」または「フォトライブラリ」から選べます。</p>
      <button type="submit">詩を生成する</button>
    </form>
  </div>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  {% if poem %}
    <h2>生成された詩</h2>
    <div class="poem">{{ poem }}</div>
  {% endif %}
</body>
</html>
